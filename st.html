<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editierbare und Filterbare Dienstleistungen (Supabase)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ... (DEINE VORHERIGEN CSS-REGELN BLEIBEN HIER UNVERÄNDERT) ... */
        
        /* --- Steuerelemente (Erweiterte Box) --- */
        .controls { 
            display: flex; 
            flex-wrap: wrap;
            gap: 25px; 
            margin-bottom: 30px; 
            padding: 20px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            align-items: center;
        }
        
        .controls button.action-btn {
            background-color: #2ecc71; /* Grüner für Aktionen */
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
        }
        .controls button.action-btn:hover {
            background-color: #27ae60;
        }

        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background-color 0.2s;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }

        /* Neue Zeile hervorheben */
        .new-row {
            background-color: #e8f9fd !important;
            border-left: 5px solid #3498db;
        }
        
        /* Visuelles Feedback beim Bearbeiten */
        [contenteditable="true"]:focus {
            outline: none;
            box-shadow: 0 0 0 2px #e74c3c;
            background-color: #fff9f9;
        }
        
    </style>
</head>
<body>

    <h1>📋 Übersicht Fahrzeugdienstleistungen (BOSS-MODUS)</h1>
    
    <div class="controls">
        <label for="filterFahrzeugart">Fahrzeugart filtern:</label>
        <select id="filterFahrzeugart" onchange="filterTable()">
            <option value="">Alle Fahrzeugarten</option>
            </select>

        <label for="filterOrt">Ort filtern:</label>
        <select id="filterOrt" onchange="filterTable()">
            <option value="">Alle Orte</option>
            </select>
        
        <button class="action-btn" onclick="addNewRow()">➕ Neuer Dienst</button>
        <button class="action-btn" onclick="saveAllChanges()">💾 Alle Speichern (BETA)</button>
        
        <span class="edit-hint">
            ➡️ **Änderungen werden nach Klick außerhalb der Zelle gespeichert!**
        </span>
    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th class="text-center" style="width: 80px;">Art.-Nr.</th>
                <th style="width: 20%;">Dienstleistung</th>
                <th style="width: 35%;">Beschreibung</th>
                <th style="width: 100px;">Fahrzeugart</th>
                <th style="width: 80px;">Ort</th>
                <th style="width: 60px;">Einheit</th>
                <th style="width: 80px;">Steuerart</th>
                <th class="text-right" style="width: 100px;">Netto</th>
                <th class="text-right" style="width: 100px;">Brutto</th>
                <th style="width: 50px;">Aktion</th> </tr>
        </thead>
        <tbody id="dataTableBody">
            </tbody>
    </table>
    
    <script>
        // *** 1. INITIALISIERUNG VON SUPABASE ***
        const SUPABASE_URL = 'DEINE_SUPABASE_URL_HIER'; 
        const SUPABASE_ANON_KEY = 'DEIN_ANON_KEY_HIER'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const TABLE_NAME = 'services'; 
        const USt_SATZ = 1.19;
        const tableBody = document.getElementById('dataTableBody');

        // Spaltennamen (müssen mit deiner Supabase-Tabelle übereinstimmen!)
        const COLUMN_KEYS = [
            'article_number', 'service_name', 'description', 
            'vehicle_type', 'location', 'unit', 'tax_type', 
            'price_net'
        ];
        
        // --- 2. Hilfsfunktionen ---
        
        // Brutto-Preis berechnen und anzeigen
        function updateBrutto(nettoCell) {
            const row = nettoCell.closest('tr');
            const bruttoCell = row.querySelector('.brutto-price');
            
            // Wert säubern
            let nettoValue = nettoCell.textContent.replace(/[^0-9,.]/g, '').replace(',', '.');
            const nettoPrice = parseFloat(nettoValue) || 0;
            
            const bruttoPrice = nettoPrice * USt_SATZ;
            bruttoCell.textContent = bruttoPrice.toFixed(2).replace('.', ',');
        }

        // Datenbank-Update-Funktion
        async function updateDatabase(cell, rowId, columnKey, newValue) {
            // Speichere den ursprünglichen Wert, falls Fehler auftritt
            const oldValue = cell.getAttribute('data-old-value');
            cell.style.boxShadow = '0 0 0 2px orange'; // Visuelles Feedback: Speichern...

            // Bereinigung des Zahlenwerts, falls es der Preis ist
            if (columnKey === 'price_net') {
                newValue = parseFloat(newValue.replace(/[^0-9,.]/g, '').replace(',', '.')) || 0;
            }
            
            const { error } = await supabase
                .from(TABLE_NAME)
                .update({ [columnKey]: newValue })
                .eq('id', rowId);

            if (error) {
                console.error("Fehler beim Speichern:", error.message);
                alert(`Fehler beim Speichern: ${error.message}. Der Wert wurde zurückgesetzt.`);
                cell.textContent = oldValue; // Wert zurücksetzen
                cell.style.boxShadow = '0 0 0 2px red'; 
                cell.setAttribute('data-old-value', oldValue); // Alten Wert wiederherstellen
            } else {
                console.log(`Datenbank erfolgreich aktualisiert: ID ${rowId}, Spalte ${columnKey}`);
                cell.setAttribute('data-old-value', newValue); // Neuen Wert als Old-Value speichern
                cell.style.boxShadow = '0 0 0 2px #2ecc71'; // Visuelles Feedback: Gespeichert!
            }
            
            // Nach kurzer Zeit den Rahmen entfernen
            setTimeout(() => {
                cell.style.boxShadow = 'none';
            }, 1000);
        }

        // Erstellt eine Tabellenzeile aus einem Datenobjekt
        function createRow(data) {
            const row = document.createElement('tr');
            // Die Supabase ID wird als data-id Attribut gespeichert
            row.setAttribute('data-id', data.id || 'NEW'); 
            // Filter Attribute (optional, da wir die Felder aus den Zellen nehmen könnten)
            row.setAttribute('data-fahrzeugart', data.vehicle_type || 'NA');
            row.setAttribute('data-ort', data.location || '');

            const cells = [
                // Art.-Nr. (Spalte 1)
                { key: 'article_number', class: 'text-center', value: data.article_number || '' },
                // Dienstleistung (Spalte 2)
                { key: 'service_name', value: data.service_name || '' },
                // Beschreibung (Spalte 3)
                { key: 'description', value: data.description || '' },
                // Fahrzeugart (Spalte 4)
                { key: 'vehicle_type', value: data.vehicle_type || '' },
                // Ort (Spalte 5)
                { key: 'location', value: data.location || '' },
                // Einheit (Spalte 6)
                { key: 'unit', value: data.unit || 'Stück' },
                // Steuerart (Spalte 7) - Nicht editierbar, da konstant
                { key: 'tax_type', value: data.tax_type || 'USt19', editable: false }, 
                // VK Netto (Spalte 8)
                { key: 'price_net', class: 'text-right editable-price', value: (data.price_net || 0).toFixed(2).replace('.', ',') },
                // VK Brutto (Spalte 9) - Berechnet, nicht editierbar
                { key: 'price_brutto', class: 'text-right brutto-price', value: ((data.price_net || 0) * USt_SATZ).toFixed(2).replace('.', ','), editable: false },
            ];

            cells.forEach(cellData => {
                const td = document.createElement('td');
                td.textContent = cellData.value;
                td.setAttribute('data-column', cellData.key);
                td.className = cellData.class || '';
                
                // Alle Spalten editierbar, außer Brutto und Steuer
                if (cellData.editable !== false) {
                    td.setAttribute('contenteditable', 'true');
                    td.setAttribute('data-old-value', cellData.value);
                    
                    // Besonderer Handler für Netto-Preis
                    if (cellData.key === 'price_net') {
                         td.oninput = (e) => updateBrutto(e.target);
                    }
                    
                    // Speichern bei Verlassen der Zelle (Blur)
                    td.onblur = (e) => {
                        const rowId = e.target.closest('tr').getAttribute('data-id');
                        const columnKey = e.target.getAttribute('data-column');
                        const newValue = e.target.textContent.trim();
                        const oldValue = e.target.getAttribute('data-old-value');

                        if (newValue !== oldValue && rowId !== 'NEW') {
                            updateDatabase(e.target, rowId, columnKey, newValue);
                        }
                        
                        // Bei Änderungen der Fahrzeugart/Ort, Filter aktualisieren
                        if (columnKey === 'vehicle_type' || columnKey === 'location') {
                            e.target.closest('tr').setAttribute('data-fahrzeugart', data.vehicle_type);
                            e.target.closest('tr').setAttribute('data-ort', data.location);
                            populateFilterOptions();
                            filterTable();
                        }
                    };
                }
                row.appendChild(td);
            });
            
            // Aktion-Spalte (Löschen)
            const actionTd = document.createElement('td');
            actionTd.className = 'text-center';
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '❌ Löschen';
            deleteBtn.className = 'delete-btn';
            deleteBtn.onclick = () => deleteRow(row);
            actionTd.appendChild(deleteBtn);
            row.appendChild(actionTd);


            return row;
        }

        // --- 3. CRUD-Funktionen ---
        
        // Daten aus Supabase laden
        async function loadData() {
            tableBody.innerHTML = '<tr><td colspan="10" class="text-center">Lade Daten von Supabase...</td></tr>';
            
            const { data, error } = await supabase
                .from(TABLE_NAME)
                .select('*')
                .order('service_name', { ascending: true });

            if (error) {
                console.error("Fehler beim Laden der Daten:", error);
                tableBody.innerHTML = `<tr><td colspan="10" style="color:red;">Fehler beim Laden der Daten: ${error.message}</td></tr>`;
                return;
            }

            tableBody.innerHTML = ''; // Tabelle leeren
            data.forEach(item => {
                tableBody.appendChild(createRow(item));
            });
            
            // Filter und Event-Listener neu setzen
            populateFilterOptions();
            filterTable();
        }
        
        // Neue Zeile hinzufügen (Nur lokal)
        window.addNewRow = function() {
            // Erstellt ein leeres Datenobjekt für die neue Zeile
            const newEmptyData = {
                id: 'NEW', // Temporäre ID
                service_name: 'NEUER DIENST',
                price_net: 0,
                unit: 'Stück',
                tax_type: 'USt19',
                vehicle_type: 'NA',
                location: '',
                description: 'Bitte hier alle Felder ausfüllen und speichern!',
                article_number: ''
            };
            const newRow = createRow(newEmptyData);
            newRow.classList.add('new-row');
            tableBody.prepend(newRow);
            
            // Fokus auf das erste editierbare Feld
            newRow.querySelector('[contenteditable="true"]').focus(); 
        };
        
        // Alle NEUEN Zeilen in der Datenbank speichern
        window.saveAllChanges = async function() {
             const newRows = tableBody.querySelectorAll('tr.new-row');
             
             if (newRows.length === 0) {
                 alert('Keine neuen Einträge zum Speichern gefunden.');
                 return;
             }
             
             for (const row of newRows) {
                 const newService = {};
                 let isValid = true;

                 // Sammle alle Daten aus den editierbaren Zellen
                 row.querySelectorAll('[data-column]').forEach(cell => {
                    const key = cell.getAttribute('data-column');
                    let value = cell.textContent.trim();

                    if (key === 'price_net') {
                       value = parseFloat(value.replace(/[^0-9,.]/g, '').replace(',', '.')) || 0;
                    }
                    if (key === 'service_name' && value === 'NEUER DIENST') {
                        isValid = false;
                        alert('Bitte Dienstleistungsname ändern!');
                        cell.focus();
                    }
                    newService[key] = value;
                 });

                 if (isValid) {
                     row.style.boxShadow = '0 0 0 4px orange';
                     
                     // Speichern in Supabase
                     const { data, error } = await supabase
                         .from(TABLE_NAME)
                         .insert([newService])
                         .select();

                     if (error) {
                         alert(`Fehler beim Speichern des Dienstes: ${error.message}`);
                         row.style.boxShadow = '0 0 0 4px red';
                     } else {
                         row.classList.remove('new-row');
                         row.setAttribute('data-id', data[0].id); // Setze die echte ID
                         row.style.boxShadow = '0 0 0 4px #2ecc71';
                         setTimeout(() => row.style.boxShadow = 'none', 1000);
                     }
                 } else {
                     row.style.boxShadow = '0 0 0 4px red';
                 }
             }
             // Filter aktualisieren, nachdem neue Daten gespeichert wurden
             loadData(); 
        }

        // Zeile löschen
        async function deleteRow(row) {
            const rowId = row.getAttribute('data-id');
            const serviceName = row.querySelector('[data-column="service_name"]').textContent;

            if (rowId === 'NEW') {
                row.remove(); // Neue, ungespeicherte Zeile einfach entfernen
                return;
            }

            if (!confirm(`Soll der Dienst "${serviceName}" (ID: ${rowId}) wirklich gelöscht werden?`)) {
                return;
            }
            
            row.style.backgroundColor = '#ffdddd';
            
            const { error } = await supabase
                .from(TABLE_NAME)
                .delete()
                .eq('id', rowId);

            if (error) {
                console.error("Fehler beim Löschen:", error.message);
                alert(`Fehler beim Löschen: ${error.message}`);
                row.style.backgroundColor = 'white';
            } else {
                row.remove(); // Zeile aus der Ansicht entfernen
                populateFilterOptions(); // Filter aktualisieren
            }
        }
        
        // --- 4. FILTER-FUNKTIONEN ---
        
        // Füllt die Filter-Select-Boxen (FZ-Art und Ort)
        function populateFilterOptions() {
             const rows = tableBody.querySelectorAll('tr');
             const fahrzeugarten = new Set();
             const orte = new Set();
             
             rows.forEach(row => {
                 const fzArt = row.querySelector('[data-column="vehicle_type"]').textContent;
                 const ort = row.querySelector('[data-column="location"]').textContent;
                 
                 if (fzArt) fahrzeugarten.add(fzArt);
                 if (ort) orte.add(ort);
             });
             
             // Füllt die Select-Box für Fahrzeugarten
             const filterFzArt = document.getElementById('filterFahrzeugart');
             filterFzArt.innerHTML = '<option value="">Alle Fahrzeugarten</option>';
             [...fahrzeugarten].sort().forEach(art => {
                 const option = document.createElement('option');
                 option.value = art;
                 option.textContent = art === 'NA' ? 'Sonstige/Unbekannt' : art;
                 filterFzArt.appendChild(option);
             });

             // Füllt die Select-Box für Orte
             const filterOrt = document.getElementById('filterOrt');
             filterOrt.innerHTML = '<option value="">Alle Orte</option>';
             [...orte].sort().forEach(ort => {
                 const option = document.createElement('option');
                 option.value = ort;
                 option.textContent = ort === '' ? 'Unspezifiziert' : (ort.charAt(0).toUpperCase() + ort.slice(1));
                 filterOrt.appendChild(option);
             });
        }
        
        // Filtert die Tabelle basierend auf den Select-Boxen
        window.filterTable = function() {
            const selectedFzArt = document.getElementById('filterFahrzeugart').value;
            const selectedOrt = document.getElementById('filterOrt').value;
            const rows = tableBody.querySelectorAll('tr');

            rows.forEach(row => {
                const fzArt = row.querySelector('[data-column="vehicle_type"]').textContent;
                const ort = row.querySelector('[data-column="location"]').textContent;

                const matchesFzArt = !selectedFzArt || fzArt === selectedFzArt;
                const matchesOrt = !selectedOrt || ort === selectedOrt;

                if (matchesFzArt && matchesOrt) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        };
        
        // Initialer Aufruf zum Laden der Daten beim Start
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
