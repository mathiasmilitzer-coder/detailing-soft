<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DetailinSoft Dynamisch & Zentriert</title>
    <style>
        /* DYNAMISCHE SCHRIFTGRÖßEN MIT CLAMP UND VW */

        /* BASE STYLES */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Zentriert die Inhalte (Header, Main, Footer) vertikal */
            justify-content: center; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* HEADER ANPASSUNGEN */
        .header-content {
            /* Entfernt margin-bottom: auto, da der body nun anders zentriert */
            margin-bottom: 20px; 
        }

        /* Farbanpassung für Detailing - Soft */
        .blue-part {
            color: #007bff; /* Blau */
        }
        .red-part {
            color: #dc3545; /* Rot */
        }

        /* Detailin - Soft (h1) */
        .header-content h1 {
            /* Fließende Größe: Min 40px, Bevorzugt 8vw, Max 100px */
            font-size: clamp(40px, 8vw, 100px);
            margin-bottom: 0.1em;
            line-height: 1.1;
        }

        /* Willkommen (p) */
        .header-content p {
            /* Fließende Größe: Min 24px, Bevorzugt 3vw, Max 48px */
            font-size: clamp(24px, 3vw, 48px);
            margin-top: 0;
        }
        
        /* NEUER CONTAINER FÜR DIE MITTIGE ZENTRIERUNG */
        .main-content {
            /* Nimmt den gesamten freien Platz zwischen Header und Footer ein */
            margin: auto; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 0; /* Optional: etwas vertikaler Puffer */
        }

        /* BUTTON ANPASSUNGEN (JETZT INNERHALB VON .main-content) */
        .footer-buttons {
            display: flex;
            gap: 20px;
            /* Entfernt unnötige margin/padding, da die Positionierung durch .main-content erfolgt */
            margin: 0; 
            padding: 0; 
            justify-content: center;
        }
        
        /* FOOTER-BEREICH (am unteren Rand, falls noch andere Elemente hier wären) */
        .footer-bottom {
            margin-top: 20px;
            /* Hier können Sie Elemente hinzufügen, die wirklich unten stehen sollen */
        }

        .button {
            padding: 12px 25px;
            /* Button-Schrift skaliert etwas mit */
            font-size: clamp(16px, 1.5vw, 20px); 
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Media Query zur Stapelung der Buttons auf sehr kleinen Bildschirmen */
        @media (max-width: 480px) {
            .footer-buttons {
                flex-direction: column;
                gap: 15px;
                width: 80%;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header-content">
        <h1><span class="blue-part">Detailing -</span> <span class="red-part">Soft</span></h1>
        <p>Boss Dash</p>
    </div>

    <div class="main-content">
        <div class="footer-buttons">
            <a href="start.html" class="button">Start</a>
            <a href="#" class="button">Angebot</a>
        </div>
    </div>
    
    <div class="footer-bottom">
        </div>

</body>
</html>
