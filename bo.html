<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DetailinSoft Dynamisch & Zentriert</title>
    <style>
        /* DYNAMISCHE SCHRIFTGRÖßEN MIT CLAMP UND VW */

        /* BASE STYLES */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        /* HEADER ANPASSUNGEN */
        .header-content {
            margin-bottom: auto;
        }

        /* Farbanpassung für Detailing - Soft */
        .blue-part {
            color: #007bff; /* Blau */
        }
        .red-part {
            color: #dc3545; /* Rot */
        }

        /* Detailin - Soft (h1) */
        .header-content h1 {
            /* Fließende Größe: Min 40px, Bevorzugt 8vw, Max 100px */
            font-size: clamp(40px, 8vw, 100px);
            margin-bottom: 0.1em;
            line-height: 1.1;
        }

        /* Willkommen (p) */
        .header-content p {
            /* Fließende Größe: Min 24px, Bevorzugt 3vw, Max 48px */
            font-size: clamp(24px, 3vw, 48px);
            margin-top: 0;
        }

        /* FOOTER & BUTTON ANPASSUNGEN */
        .footer-buttons {
            display: flex;
            gap: 20px;
            margin-top: auto;
            justify-content: center;
            /* HIER WIRD DER ABSTAND ZUM UNTEREN RAND ANGEPASST */
            padding-bottom: 50px; 
        }

        .button {
            padding: 12px 25px;
            /* Button-Schrift skaliert etwas mit */
            font-size: clamp(16px, 1.5vw, 20px); 
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Media Query zur Stapelung der Buttons auf sehr kleinen Bildschirmen */
        @media (max-width: 480px) {
            .footer-buttons {
                flex-direction: column;
                gap: 15px;
                padding-bottom: 30px; /* Etwas weniger Abstand auf kleinen Bildschirmen */
                width: 80%;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header-content">
        <h1><span class="blue-part">Detailing -</span> <span class="red-part">Soft</span></h1>
        <p>Boss Dash</p>
    </div>

    <div class="footer-buttons">
        <a href="start.html" class="button">Start</a>
        <a href="#" class="button">Angebot</a>
    </div>

</body>
</html>
