<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrzeugpflege Preisliste (Supabase)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app" class="max-w-6xl mx-auto bg-white rounded-xl shadow-2xl p-6 md:p-10">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-4 border-b-4 border-emerald-600 pb-2">
            Fahrzeugpflege Preisliste (Supabase)
        </h1>
        <p class="text-gray-600 mb-6">
            Echtzeit-Daten geladen aus Ihrer Supabase-Datenbank.
        </p>

        <!-- Lade-/Fehlerstatus -->
        <div id="status-message" class="text-center text-sm p-3 mb-6 bg-blue-100 text-blue-700 rounded-lg" role="alert">Lade Daten...</div>

        <!-- Filter und Steuerelemente -->
        <div class="flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0 md:space-x-4 mb-6">
            <div class="w-full md:w-auto">
                <label for="vehicle-filter" class="block text-sm font-medium text-gray-700 mb-1">Nach Fahrzeugart filtern:</label>
                <select id="vehicle-filter" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm rounded-md shadow-sm">
                    <option value="all">Alle Fahrzeugarten</option>
                </select>
            </div>
        </div>

        <!-- Preisliste Tabelle -->
        <div class="overflow-x-auto shadow-lg rounded-lg border border-gray-200">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-emerald-600">
                    <tr>
                        <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-white rounded-tl-lg">Dienstleistung</th>
                        <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-white">Fahrzeugart</th>
                        <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-white hidden md:table-cell">Ort</th>
                        <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-white text-right rounded-tr-lg">VK Netto (€)</th>
                    </tr>
                </thead>
                <tbody id="price-list-body" class="bg-white divide-y divide-gray-100">
                    <!-- Daten werden hier via JavaScript eingefügt -->
                </tbody>
            </table>
        </div>
        <p id="no-results" class="hidden mt-4 text-center text-gray-500">Keine Ergebnisse für die gewählte Filterung gefunden.</p>
    </div>

    <script>
        // *** BITTE ERSETZEN SIE DIESE PLATZHALTER MIT IHREN SUPABASE-SCHLÜSSELN ***
        const SUPABASE_URL = 'https://jfhscavsltuxpefciics.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmaHNjYXZzbHR1eHBlZmNpaWNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2MTk1NTUsImV4cCI6MjA3ODE5NTU1NX0.PphX0A6T5k9C4c42tDSOLQ1OLID45JcSUcvBCOG4OBs'; 
        const TABLE_NAME = 'dienstleistungen'; 
        // *************************************************************************

        // Initialisiert den Supabase Client
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusMessage = document.getElementById('status-message');
        const priceListBody = document.getElementById('price-list-body');
        const vehicleFilter = document.getElementById('vehicle-filter');
        const noResults = document.getElementById('no-results');

        let allPrices = []; // Speichert alle geladenen Preise

        // Funktion zur Anzeige von Statusmeldungen
        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.classList.remove('bg-blue-100', 'text-blue-700', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            if (type === 'error') {
                statusMessage.classList.add('bg-red-100', 'text-red-700');
            } else if (type === 'success') {
                statusMessage.classList.add('bg-green-100', 'text-green-700');
            } else {
                statusMessage.classList.add('bg-blue-100', 'text-blue-700');
            }
        }

        // ------------------------------------
        // LADEFUNKTIONEN
        // ------------------------------------

        async function fetchPrices() {
            showStatus('Lade Preisdaten aus Supabase...', 'info');
            try {
                // Abfrage aller Daten aus der Tabelle
                const { data, error } = await supabase
                    .from(TABLE_NAME)
                    .select('service, vehicle_type, location, price_netto')
                    .order('service', { ascending: true }); // Daten alphabetisch sortieren

                if (error) throw error;
                
                allPrices = data || [];
                updateFilterOptions(allPrices);
                applyFilter();
                showStatus(`Daten erfolgreich geladen (${allPrices.length} Einträge).`, 'success');

            } catch (error) {
                console.error('Fehler beim Laden der Daten:', error);
                showStatus(`Fehler beim Laden der Daten: ${error.message || 'Unbekannter Fehler'}. Haben Sie die API-Schlüssel korrekt eingesetzt?`, 'error');
            }
        }

        // ------------------------------------
        // RENDERING & FILTERFUNKTIONEN
        // ------------------------------------

        function renderTable(data) {
            priceListBody.innerHTML = '';
            noResults.classList.add('hidden');

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }

            data.forEach(item => {
                const row = document.createElement('tr');
                row.classList.add('hover:bg-gray-50', 'transition', 'duration-150', 'ease-in-out');
                // Das 'location' Feld wird auf kleinen Bildschirmen ausgeblendet (hidden md:table-cell)
                row.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">${item.service}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-emerald-600 font-medium">${item.vehicle_type || 'NA'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500 hidden md:table-cell">${item.location || 'NA'}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-bold text-gray-900 text-right">${item.price_netto.toFixed(2).replace('.', ',')} €</td>
                `;
                priceListBody.appendChild(row);
            });
        }

        function updateFilterOptions(data) {
            const vehicleTypes = new Set(data.map(item => item.vehicle_type).filter(type => type && type !== 'NA'));
            let currentFilter = vehicleFilter.value;

            vehicleFilter.innerHTML = '<option value="all">Alle Fahrzeugarten</option>';

            Array.from(vehicleTypes).sort().forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type;
                vehicleFilter.appendChild(option);
            });

            vehicleFilter.value = vehicleTypes.has(currentFilter) ? currentFilter : 'all';
        }

        function applyFilter() {
            const selectedType = vehicleFilter.value;

            let filteredData = allPrices;

            if (selectedType !== 'all') {
                filteredData = allPrices.filter(item => item.vehicle_type === selectedType);
            }

            renderTable(filteredData);
        }

        // Event Listener für den Filter
        vehicleFilter.addEventListener('change', applyFilter);

        // Startpunkt
        window.onload = fetchPrices;
    </script>
</body>
</html>
