<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstleistungsübersicht</title>
    <style>
        /* Optional: Grundlegendes CSS für bessere Lesbarkeit */
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>Übersicht der Fahrzeugdienstleistungen</h1>

    <table id="dienstleistungsTabelle">
        <thead>
            <tr>
                <th>Artikelnummer</th>
                <th>Dienstleistung</th>
                <th>Beschreibung</th>
                <th>Fahrzeugart</th>
                <th>Ort</th>
                <th>VK (Netto)</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script>
        // Die Daten aus Ihrer Liste, als JavaScript-Array von Objekten
        const daten = [
            { artnr: '', dienstl: '(BUS) Fahrzeuginnereinigung', beschr: 'Cockpitpflege, Scheibenreinigung innen, Teppichreinigung, Kofferraumreinigung, Türfalzen Reinigung.', fzg: 'Bus', ort: 'Innen', vk_netto: 83.99 },
            { artnr: '', dienstl: '(BUS) Lackaufbereitung', beschr: 'Pflege Kunststoffteile außen, Reifenpflege, Schleifpolitur, Antihologramm Politur, Scheibenreinigung.', fzg: 'Bus', ort: 'Außen', vk_netto: 168.03 },
            { artnr: '', dienstl: '(Bus) Fahrzeugaufbereitung', beschr: 'Komplettpflege, Innenreinigung, Polster/Lederpflege, Lackpflege/Versiegelung, Kratzerentf.', fzg: 'NA', ort: '', vk_netto: 250.00 },
            { artnr: '', dienstl: '(Bus) Geruchsentfernung', beschr: 'Behandlung des Fahrzeuginnenraumes mit Geruchskiller.', fzg: 'Bus', ort: 'Innen', vk_netto: 83.99 },
            { artnr: '', dienstl: '(Kombi) Lackaufbereitung', beschr: 'Pflege Kunststoffteile außen, Reifenpflege, Schleifpolitur, Antihologramm Politur, Scheibenreinigung.', fzg: 'Kombi', ort: 'Außen', vk_netto: 142.82 },
            { artnr: '100', dienstl: '(PKW) Fahrzeugaufbereitung', beschr: 'Komplettpflege, Innenreinigung, Polster/Lederpflege, Lackpflege/Versiegelung, Kratzerentf. Standard.', fzg: 'NA', ort: '', vk_netto: 140.00 },
            { artnr: '', dienstl: '(PKW) Ceramic Versiegelung', beschr: 'Hochwertige Keramikversiegelung (18-24 Monate Standzeit), Hydrophobie, Schutz vor Umwelteinflüssen.', fzg: 'PKW', ort: 'Außen', vk_netto: 462.18 },
            // Fügen Sie hier alle weiteren Datenobjekte ein.
            // ...
        ];

        // Funktion zum Befüllen der Tabelle
        function tabelleBefuellen() {
            const tbody = document.querySelector('#dienstleistungsTabelle tbody');
            
            // Schleife über das Daten-Array
            daten.forEach(item => {
                const tr = document.createElement('tr'); // Neue Zeile erstellen
                
                // Erstellen der Zellen und Einfügen der Daten
                tr.innerHTML = `
                    <td>${item.artnr}</td>
                    <td>${item.dienstl}</td>
                    <td>${item.beschr}</td>
                    <td>${item.fzg}</td>
                    <td>${item.ort}</td>
                    <td>${item.vk_netto.toFixed(2).replace('.', ',')} €</td>
                `;
                
                tbody.appendChild(tr); // Zeile zur Tabelle hinzufügen
            });
        }

        // Tabelle befüllen, sobald das DOM geladen ist
        document.addEventListener('DOMContentLoaded', tabelleBefuellen);
    </script>

</body>
</html>
