<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DetailinSoft Beispiel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Verteilt den Inhalt */
            min-height: 100vh; /* Mindesthöhe des Viewports */
            margin: 0;
            padding: 20px; /* Etwas Abstand vom Rand */
        }

        .header-content {
            text-align: center;
            margin-bottom: auto; /* Schiebt es nach oben */
        }

        .header-content h1 {
            font-size: 8em; /* Große Schrift */
            margin-bottom: 0.1em;
        }

        .header-content p {
            font-size: 1.5em; /* Mittlere Schrift für Willkommen */
            margin-top: 0;
        }

        .footer-buttons {
            display: flex;
            gap: 20px; /* Abstand zwischen den Buttons */
            margin-top: auto; /* Schiebt es nach unten */
            width: 100%; /* Volle Breite, um Justify-Content zu nutzen, falls nötig */
            justify-content: center; /* Buttons in der Mitte zentrieren */
            padding-bottom: 40px; /* Abstand vom unteren Rand */
        }

        .button {
            padding: 10px 20px;
            font-size: 1.2em;
            text-decoration: none; /* Entfernt die Unterstreichung bei Links */
            color: white;
            background-color: #007bff; /* Beispiel-Farbe */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="header-content">
        <h1>Detailing - Soft</h1>
        <p>Willkommen</p>
    </div>

    <div class="footer-buttons">
        <a href="#" class="button">Boss</a>
        <a href="#" class="button">Angebot</a>
    </div>

</body>
</html>
